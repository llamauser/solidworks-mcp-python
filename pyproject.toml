[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sw-mcp"
version = "0.1.0"
description = "SolidWorks MCP server (pure Python, pywin32) designed for small and free LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sw-mcp = "sw_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
