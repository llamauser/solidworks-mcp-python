# AI model providers the setup wizard offers, in the order it offers them.
#
# Free tiers change often. Edit this file (no code changes needed) when a provider changes its
# URLs or offer. The wizard always checks each key live and tests which models can call tools,
# so the texts below are only guidance shown to the user.
#
# Fields:
#   id, name        identifier and display name
#   base_url        OpenAI-compatible API base (…/v1); local providers need no key
#   key_url         page the wizard opens so the user can create a key
#   offer           one line: what you get for free (as of the date below)
#   requires        what signing up needs
#   privacy         "no-training" | "may-train" | "depends" | "local"
#   privacy_note    shown before the user decides
#   model_prefs     substrings, best first; models are ranked by the first match
#   model_filter    only models whose id contains this (e.g. ":free" on OpenRouter)
#   local           true for programs running on this PC (no key)
# Last reviewed: 2026-09-28

[[provider]]
id = "openrouter"
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
key_url = "https://openrouter.ai/settings/keys"
offer = "One key for many free models (IDs ending in :free). About 50 free requests/day, 1000/day after a one-time $10 credit."
requires = "Email or Google/GitHub sign-in. No card for the free models."
privacy = "depends"
privacy_note = "Free models are run by other companies; some log or train on prompts. OpenRouter lets you block those in its privacy settings (fewer free models then)."
model_prefs = ["nemotron-3-super", "nemotron-3-ultra", "qwen3", "inkling", "gemma-4", "ling", "llama", "deepseek"]
model_filter = ":free"

[[provider]]
id = "gemini"
name = "Google Gemini (AI Studio)"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
key_url = "https://aistudio.google.com/app/apikey"
offer = "Free Gemini Flash models with large context; roughly 20 to 1500 requests/day depending on the model."
requires = "A Google account. Not offered in every country."
privacy = "may-train"
privacy_note = "On the free tier Google may use prompts and answers to improve its products, and people may review them. Avoid confidential designs."
model_prefs = ["gemini-3-flash", "gemini-2.5-flash", "gemini-flash", "gemini-2.5-pro", "gemini"]

[[provider]]
id = "groq"
name = "Groq"
base_url = "https://api.groq.com/openai/v1"
key_url = "https://console.groq.com/keys"
offer = "Very fast open models (Llama, Qwen, GPT-OSS); about 1000 requests/day on larger models."
requires = "Email or Google/GitHub sign-in. No card."
privacy = "no-training"
privacy_note = "Groq says it does not train on API data. Check its current policy if designs are confidential."
model_prefs = ["gpt-oss-120b", "llama-4-maverick", "qwen3", "llama-3.3-70b", "llama-4-scout", "gpt-oss"]

[[provider]]
id = "mistral"
name = "Mistral"
base_url = "https://api.mistral.ai/v1"
key_url = "https://console.mistral.ai/api-keys"
offer = "Free 'Experiment' plan with Mistral Large/Medium/Small; about 1 request/second, large monthly token allowance."
requires = "Email and phone number verification. No card."
privacy = "may-train"
privacy_note = "The free Experiment plan may use your prompts to train Mistral models."
model_prefs = ["mistral-large", "mistral-medium", "magistral-medium", "mistral-small", "codestral"]

[[provider]]
id = "nvidia"
name = "NVIDIA NIM"
base_url = "https://integrate.api.nvidia.com/v1"
key_url = "https://build.nvidia.com/settings/api-keys"
offer = "Free developer access to many large open models (Nemotron, Llama, Qwen, DeepSeek), rate-limited."
requires = "NVIDIA developer account (email)."
privacy = "depends"
privacy_note = "Free trial use for development. Read NVIDIA's terms before using confidential designs."
model_prefs = ["nemotron-3-super", "nemotron-3-ultra", "qwen3", "llama-3.3-70b", "deepseek", "llama"]

[[provider]]
id = "cerebras"
name = "Cerebras"
base_url = "https://api.cerebras.ai/v1"
key_url = "https://cloud.cerebras.ai/"
offer = "Extremely fast large open models. The free offer has changed recently; the wizard checks if your key works."
requires = "Email sign-in; may ask for a card now."
privacy = "depends"
privacy_note = "Check Cerebras' current terms for data use."
model_prefs = ["qwen-3-235b", "gpt-oss-120b", "llama-3.3-70b", "qwen", "llama"]

[[provider]]
id = "huggingface"
name = "Hugging Face"
base_url = "https://router.huggingface.co/v1"
key_url = "https://huggingface.co/settings/tokens"
offer = "A small monthly free credit across many open models."
requires = "Free Hugging Face account. Create a token with 'Make calls to Inference Providers'."
privacy = "depends"
privacy_note = "Requests are served by partner providers with their own policies."
model_prefs = ["qwen3", "llama-3.3-70b", "deepseek", "gpt-oss"]

[[provider]]
id = "openai"
name = "OpenAI (paid)"
base_url = "https://api.openai.com/v1"
key_url = "https://platform.openai.com/api-keys"
offer = "PAID, pay per use: the GPT models. Add a payment method and some credit on your OpenAI account first. With the mini models a design session usually costs a few cents; your usage page shows the exact cost. Used after the free providers unless you choose it under Models. Can also search the internet and run terminal commands (both off until you turn them on)."
requires = "An OpenAI platform account with billing set up."
privacy = "no-training"
privacy_note = "OpenAI says data sent through its API is not used to train its models by default; it may keep it for up to 30 days for abuse monitoring."
model_prefs = ["gpt-5-mini", "gpt-5", "gpt-4.1-mini", "gpt-4.1", "gpt-4o-mini", "gpt-4o", "o4-mini"]
model_exclude = ["realtime", "audio", "search", "transcribe", "tts", "dall-e", "image", "embedding", "moderation", "davinci", "babbage", "instruct", "codex", "-pro", "deep-research", "computer-use", "sora", "-20", "chat-latest"]
paid = true
api = "responses"
max_tokens_param = "max_completion_tokens"
reasoning_models = ["gpt-5", "gpt-6", "o1", "o3", "o4"]

[[provider]]
id = "lmstudio"
name = "LM Studio (models on this PC)"
base_url = "http://127.0.0.1:1234/v1"
key_url = "https://lmstudio.ai/"
offer = "Runs models on your own computer: free and private, but needs a good GPU (8 GB+ VRAM for small models)."
requires = "Install LM Studio, download a model with tool support, and start its local server."
privacy = "local"
privacy_note = "Everything stays on this PC."
model_prefs = ["qwen", "gpt-oss", "llama", "mistral"]
local = true

[[provider]]
id = "ollama"
name = "Ollama (models on this PC)"
base_url = "http://127.0.0.1:11434/v1"
key_url = "https://ollama.com/download"
offer = "Runs models on your own computer: free and private, but needs a good GPU."
requires = "Install Ollama and pull a model with tool support (e.g. qwen3)."
privacy = "local"
privacy_note = "Everything stays on this PC."
model_prefs = ["qwen3", "gpt-oss", "llama3", "mistral"]
local = true
